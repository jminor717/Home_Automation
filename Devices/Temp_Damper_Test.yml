substitutions:
  device_name: erv-return-box
  eth_cs: GPIO9
  eth_clk: GPIO10
  eth_miso: GPIO11
  eth_mosi: GPIO12
  eth_int: GPIO13
  eth_rst: GPIO14

  servo_pot_pin: GPIO2
  servo_pin: GPIO41

  uart_tx_pin: GPIO38
  uart_rx_pin: GPIO39

  scl_pin: GPIO5
  sda_pin: GPIO4

  step_pin: GPIO20
  dir_pin: GPIO21
  en_pin: GPIO8

  device_name_opener: garage-door-opener
  device_name_receiver: t3-lora32

external_components:
  - source:
      type: local
      path: ../my_components # path relative to Devices folder



#include ""
#include ""
esphome:
  name: $device_name
  # includes:
    # - <erv_ctrl\pressurePeakFilter.h>
    # - <freertos/FreeRTOS.h>
    # - <freertos/task.h>
  # on_boot:
  #   - priority: -100
  #     then:
  #       - lock.lock: man_door_lock
  # platformio_options:
  #   board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    # sdkconfig_options:
    #   CONFIG_FREERTOS_USE_TRACE_FACILITY: y
    #   CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: y
    #   CONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS: y
      # CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y


#define configUSE_TRACE_FACILITY        1
#define configUSE_STATS_FORMATTING_FUNCTIONS 1


preferences:
  # the default of 1min is far too short--flash chip is rated for approx 100k writes.
  flash_write_interval: "240h"

api:
  # password: ""
ota:
  platform: esphome
  password: ""

logger:
  # level: very_verbose
  level: INFO
  # logs:
  #   sensor: WARN
  #   button: INFO
  #   wifi: INFO
  #   adc: INFO
  #   adc.common: INFO
  #   adc.esp32: INFO
  #   ntc: INFO
  #   mdns: INFO
  #   climate: INFO
  #   resistance: INFO
  #   ledc.output: INFO
  #   homeassistant.text_sensor: INFO
  #   pid.sensor: INFO



ethernet:
  type: W5500
  clk_pin: $eth_clk
  mosi_pin: $eth_mosi
  miso_pin: $eth_miso
  cs_pin: $eth_cs
  interrupt_pin: $eth_int
  reset_pin: $eth_rst

time:
  - platform: homeassistant

uart:
  tx_pin: $uart_tx_pin
  rx_pin: $uart_rx_pin
  baud_rate: 9600

i2c:
  - id: bus_a
    sda: $sda_pin
    scl: $scl_pin
    scan: true

button:
  - platform: restart
    name: "$device_name Restart"
  - platform: template
    id: run_call
    name: "home vent servo"
    on_press:
      then:
        lambda: !lambda |-
          id(damper)->setup();
  - platform: template
    id: center_servo
    name: "center servo"
    on_press:
      then:
        - servo.write:
            id: servo_
            level: !lambda "return 0.5;"

text_sensor:
  - platform: version
    name: "$device_name Version"


sensor:
  - { platform: uptime, id: uptime_seconds, update_interval: 1min }
  - { platform: template, id: uptime_days, name: "$device_name uptime", update_interval: 1min, 
        device_class: duration, entity_category: "diagnostic", unit_of_measurement: "d", accuracy_decimals: 2,
        lambda: !lambda "return id(uptime_seconds).state / 86'400;"}
  - { platform: mhz19, update_interval: 5s, co2: { name: MH-Z19 CO2 Value }, temperature: { name: MH-Z19 Temperature } }
  - { platform: mics_4514, update_interval: 5s, nitrogen_dioxide: { name: Nitrogen Dioxide }, carbon_monoxide: { name: Carbon Monoxide },
        hydrogen: { name: Hydrogen }, ethanol: { name: Ethanol }, methane: { name: Methane }, ammonia: { name: Ammonia } }



  - { platform: adc, id: servo_potentiometer, name: "A v_meas", pin: $servo_pot_pin, update_interval: 250ms, attenuation: 12db }

hard_stop_damper:
  - {id: damper, servo_position_sensor: servo_potentiometer, servo: servo_, 
    open_at_center: true, switch_open_and_close: false, check_position_physically: true }

servo:
  - { id: servo_, output: servo_output, transition_length: 0s, auto_detach_time: 1000ms, max_level: 50%, min_level: 1%} # transition_length: 7s

output:
  - {platform: ledc, id: servo_output, pin: $servo_pin, frequency: 200 Hz}

cover:
  - platform: template
    device_class: damper
    id: test_vent
    name: vent under test
    restore_mode: NO_RESTORE
    has_position: true
    open_action: { servo.write: { id: servo_, level: !lambda "return id(damper).open_position;" } }
    close_action: { servo.write: { id: servo_, level: !lambda "return  id(damper).close_position;" }}
    position_action: { servo.write: { id: servo_, level: !lambda "return id(damper).tilt_to_servo_position(pos);" }}
    lambda: "return id(damper).get_tilt();"
    tilt_action: { servo.write: { id: servo_, level: !lambda "return id(damper).tilt_to_servo_position(tilt);" }}
    tilt_lambda: !lambda "return id(damper).get_tilt();"












number:
  - platform: template
    name: vent Control
    min_value: 0
    initial_value: 100
    max_value: 100
    step: 1
    optimistic: true
    set_action:
      then:
        - servo.write:
            id: servo_
            level: !lambda "return id(damper).tilt_to_servo_position(( x / 100.0));"
  - platform: template
    name: servo Control
    min_value: -8
    initial_value: 50
    max_value: 100
    step: 1
    optimistic: true
    set_action:
      then:
        - servo.write:
            id: servo_
            level: !lambda "return x / 100.0;"


