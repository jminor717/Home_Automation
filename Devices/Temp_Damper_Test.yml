cover:
  - platform: template
    device_class: damper
    id: attic_return_vent
    name: attic return vent
    restore_mode: NO_RESTORE
    has_position: true
    open_action: 
        - stepper.set_target: { id: right_door_servo, target: !lambda "return 4000 * 8;" }
        # - lambda: |-
        #     char buffer[1024]; 
            
        #     ESP_LOGI("TASKS", "--- Current RTOS Tasks ---");
        #     ESP_LOGI("TASKS", "Task Name\tState\tPrio\tStack\tNum\tCore");
            
        #     // Populate the buffer with task statistics
        #     vTaskList(buffer);
            
        #     // Print the result
        #     ESP_LOGI("TASKS", "%s", buffer);
        #     ESP_LOGI("TASKS", "---------------------------\n");

    close_action: { stepper.set_target: { id: right_door_servo, target: !lambda "return  0;" }}
    tilt_action: { stepper.set_target: { id: right_door_servo, target: !lambda "return 4000 * 4;" }}
    tilt_lambda: !lambda "return id(right_door_servo).current_position;"
    lambda: "return id(right_door_servo).current_position < 200 ? esphome::cover::COVER_CLOSED : esphome::cover::COVER_OPEN;"


# 400steps per rotation
stepper:
  - platform: a4988
    id: right_door_servo
    step_pin: $step_pin
    dir_pin: $dir_pin
    sleep_pin: $en_pin
    # max_speed: 16000 steps/s # 2400 RPM
    # acceleration: 8000
    # deceleration: 8000
    max_speed: 4000 steps/s # 2400 RPM
    acceleration: 2000
    deceleration: 2000




