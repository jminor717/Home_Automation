substitutions:
  device_name: erv-return-box
  eth_cs: GPIO9
  eth_clk: GPIO10
  eth_miso: GPIO11
  eth_mosi: GPIO12
  eth_int: GPIO13
  eth_rst: GPIO14

  servo_pot_pin: GPIO2
  servo_pin: GPIO41

  uart_tx_pin: GPIO38
  uart_rx_pin: GPIO39

  scl_pin: GPIO5
  sda_pin: GPIO4

  step_pin: GPIO20
  dir_pin: GPIO21
  en_pin: GPIO8

  device_name_opener: garage-door-opener
  device_name_receiver: t3-lora32

external_components:
  - source:
      type: local
      path: ../my_components # path relative to Devices folder



#include ""
#include ""
esphome:
  name: $device_name
  # includes:
    # - <erv_ctrl\pressurePeakFilter.h>
    # - <freertos/FreeRTOS.h>
    # - <freertos/task.h>
  # on_boot:
