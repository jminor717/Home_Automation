ethernet:
  type: W5500
  clk_pin: $eth_clk
  mosi_pin: $eth_mosi
  miso_pin: $eth_miso
  cs_pin: $eth_cs
  interrupt_pin: $eth_int
  reset_pin: $eth_rst

time:
  - platform: homeassistant

# SPI bus for LoRa radio
spi:
  interface: spi3
  id: spi3
  clk_pin: GPIO17
  mosi_pin: GPIO15
  miso_pin: GPIO16

