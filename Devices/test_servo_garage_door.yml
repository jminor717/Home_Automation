uart:
  id: uart_1
  tx_pin: GPIO5
  rx_pin: GPIO4
  baud_rate: 38400
  # debug:
  #   direction: BOTH
  #   # dummy_receiver: true
  #   debug_prefix: "[MODS] "
  #   after:
  #     delimiter: "\n"
  #   sequence:
  #     - lambda: UARTDebug::log_string(direction, bytes, debug_prefix);

sensor:
  - { platform: uptime, id: uptime_seconds, update_interval: 1min }
  - { platform: template, id: uptime_days, name: "$device_name uptime", update_interval: 1min, 
        device_class: duration, entity_category: "diagnostic", unit_of_measurement: "d", accuracy_decimals: 2,
        lambda: !lambda "return id(uptime_seconds).state / 86'400;"}

number:
  - { platform: template, id: move_steps, name: steps, initial_value: 8000,  min_value: 0,  max_value: 100000, step: 1, optimistic: true }
  - { platform: template, id: move_acc, name: acceleration, initial_value: 8000,  min_value: 0,  max_value: 20000, step: 1, optimistic: true }
  - { platform: template, id: move_vel, name: velocity, initial_value: 8000,  min_value: 0,  max_value: 20000, step: 1, optimistic: true }
  - { platform: template, id: move_dir, name: direction, initial_value: 0,  min_value: 0,  max_value: 1, step: 1, optimistic: true }