  eth_cs: GPIO9
  eth_clk: GPIO10
  eth_miso: GPIO11
  eth_mosi: GPIO12
  eth_int: GPIO13
  eth_rst: GPIO14

external_components:
  - source:
      type: local
      path: ../my_components # path relative to Devices folder


esphome:
  name: $device_name

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf



preferences:
  flash_write_interval: "240h"

api:
  # password: ""
ota:
  platform: esphome
  password: ""

# logger:
#   # level: very_verbose
#   level: INFO
logger:
  level: verbose
  logs:
    wifi: INFO
    sensor: INFO
    binary_sensor: INFO



ethernet:
  type: W5500
  clk_pin: $eth_clk
  mosi_pin: $eth_mosi
  miso_pin: $eth_miso
  cs_pin: $eth_cs
  interrupt_pin: $eth_int
  reset_pin: $eth_rst

