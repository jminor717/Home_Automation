# <<: !include lora_garage_door_subs.yml


substitutions:
  device_name: erv-return-box
  device_name_opener: garage-door-opener
  device_name_receiver: t3-lora32
  eth_cs: GPIO9
  eth_clk: GPIO10
  eth_miso: GPIO11
  eth_mosi: GPIO12
  eth_int: GPIO13
  eth_rst: GPIO14

  scl_pin: GPIO5
  sda_pin: GPIO4


#define LORA_RST            12
#define LORA_DI0            32
#define RADIO_DIO_1         33
#define RADIO_DIO_2         34
#define LORA_SS             5
#define LORA_MISO           19
#define LORA_MOSI           23
#define LORA_SCK            18

  lora_clk_pin: GPIO17
  lora_mosi_pin: GPIO15
  lora_miso_pin: GPIO16
  lora_dio0_pin: GPIO7
  lora_cs_pin: GPIO18
  lora_rst_pin: GPIO6

external_components:
  - source:
      type: local
      path: ../../../my_components # path relative to Devices folder



#include ""
#include ""
