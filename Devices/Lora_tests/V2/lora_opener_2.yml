esphome:
  name: $device_name
  on_boot:
    - priority: -100
      then:
        - sensor.template.publish:
            id: local_garage_door_state
            state: 10

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    # sdkconfig_options:
    #   CONFIG_FREERTOS_USE_TRACE_FACILITY: y
    #   CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: y
    #   CONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS: y
      # CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y


#define configUSE_TRACE_FACILITY        1
#define configUSE_STATS_FORMATTING_FUNCTIONS 1


preferences:
  # the default of 1min is far too short--flash chip is rated for approx 100k writes.
  flash_write_interval: "240h"

api:
  # password: ""
ota:
  platform: esphome
  password: ""

logger:
  # level: very_verbose
  level: INFO
  # logs:
  #   sensor: WARN
  #   button: INFO
  #   wifi: INFO
  #   adc: INFO
  #   adc.common: INFO
  #   adc.esp32: INFO
  #   ntc: INFO
  #   mdns: INFO
  #   climate: INFO
  #   resistance: INFO
  #   ledc.output: INFO
  #   homeassistant.text_sensor: INFO
  #   pid.sensor: INFO



ethernet:
  type: W5500
  clk_pin: $eth_clk
  mosi_pin: $eth_mosi
  miso_pin: $eth_miso
  cs_pin: $eth_cs
  interrupt_pin: $eth_int
  reset_pin: $eth_rst

time:
  - platform: homeassistant




# SPI bus for LoRa radio
spi:
  interface: spi3
  id: spi3
  clk_pin: $lora_clk_pin
  mosi_pin: $lora_mosi_pin
  miso_pin: $lora_miso_pin


button:
  - platform: restart
    name: "$device_name Restart"
  - platform: template
    name: "Send LoRa Packet"
    on_press:
      then:
        - lambda: id(sentPackets)++;
        - sx127x.send_packet:
            data: [0xDE, 0xAD, 0xBE, 0xEF, 0xCA, 0xFE, 0xBA, 0xBE]



text_sensor:
  - platform: version
    name: "$device_name Version"


# LoRa Radio Configuration (SX1276/SX1278)
sx127x:
  data_rate: 100khz
  spi_id: spi3
  setup_priority: 801
  dio0_pin: $lora_dio0_pin
  cs_pin:
    number: $lora_cs_pin
    inverted: false
  rst_pin: $lora_rst_pin
  pa_pin: BOOST
  pa_power: 10
  bandwidth: 125_0kHz
  crc_enable: true
  frequency: 915MHz
  # frequency: 433920000
  modulation: LORA
  rx_start: true
  sync_value: 0x12
  preamble_size: 8
  spreading_factor: 7
  coding_rate: CR_4_6
  on_packet:
    then:
      - lambda: |-
          id(receivedPackets)++;
          // ESP_LOGI("lora", "Received packet RSSI: %.2f dBm, SNR: %.2f dB", rssi, snr);

globals:
  - { id: receivedPackets, type: int, initial_value: "0"}
  - { id: sentPackets, type: int, initial_value: "0"}

packet_transport:
  platform: sx127x
  update_interval: 5s
  encryption: "780905cb-619f-4663-b246-256ba69c2ea6"
  rolling_code_enable: true
  ping_pong_enable: true
  sensors:
    - id: local_garage_door_state
      broadcast_id: remote_garage_door_state
  providers:
    - name: $device_name_receiver
      encryption: "780905cb-619f-4663-b246-256ba69c2ea6"



# .defaultfilters:
#   - &throttle
