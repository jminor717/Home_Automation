#   - &moving_avg
#   - sliding_window_moving_average:
#     window_size: 20
#     send_every: 10
#   - &delta
#   - delta: 0.9
#   - throttle: 5s


binary_sensor:
  - platform: packet_transport
    provider: $device_name_receiver
    type: status
    name: receiver connection status
    internal: false
sensor:
  - { platform: uptime, id: uptime_seconds, update_interval: 1min }
  - { platform: template, id: uptime_days, name: "$device_name uptime", update_interval: 1min, 
      device_class: duration, entity_category: "diagnostic", unit_of_measurement: "d", accuracy_decimals: 2,
      lambda: !lambda "return id(uptime_seconds).state / 86'400;"}
  - platform: template
    id: local_garage_door_state
    name: local state
    internal: false
    update_interval: never
  - platform: packet_transport
    provider: $device_name_receiver
    id: remote_garage_door_state
    name: remote state
    internal: false
    on_value:
      - if:
          condition: 
            lambda: |-
              return  !(std::abs(id(local_garage_door_state).state - 10) <= 0.1) 
                    && id(local_garage_door_state).state != id(remote_garage_door_state).state ;
          then:
            - sensor.template.publish:
                id: local_garage_door_state
                state: !lambda "if (std::isfinite(x)) { return x; } return 10;"


switch:
  - platform: template
    name: "Template Switch"
    optimistic: true
    id: local_switch
    turn_on_action:
      - while:
          condition: { lambda: !lambda 'return id(remote_garage_door_state).state != id(local_garage_door_state).state;' }
          then:
          - { lambda: !lambda 'ESP_LOGI("lora", "Still executing open: %.2f  %.2f", id(local_garage_door_state).state, id(remote_garage_door_state).state);' }
          - sensor.template.publish: { id: local_garage_door_state, state: 12}
          - delay: 1s

    turn_off_action:
      - while:
          condition: { lambda: !lambda 'return id(remote_garage_door_state).state != id(local_garage_door_state).state;' }
          then:
          - { lambda: !lambda 'ESP_LOGI("lora", "Still executing close: %.2f  %.2f", id(local_garage_door_state).state, id(remote_garage_door_state).state);' }
          - sensor.template.publish: { id: local_garage_door_state, state: 8}
          - delay: 1s






