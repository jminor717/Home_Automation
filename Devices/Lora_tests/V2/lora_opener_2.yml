ethernet:
  type: W5500
  clk_pin: $eth_clk
  mosi_pin: $eth_mosi
  miso_pin: $eth_miso
  cs_pin: $eth_cs
  interrupt_pin: $eth_int
  reset_pin: $eth_rst

time:
  - platform: homeassistant

text_sensor:
  - platform: version
    name: "$device_name Version"

# SPI bus for LoRa radio
spi:
  # interface: spi3
  # id: spi3
  # clk_pin: GPIO17
  # mosi_pin: GPIO15
  # miso_pin: GPIO16
  interface: spi3
  id: spi3
  clk_pin: $lora_clk_pin
  mosi_pin: $lora_mosi_pin
  miso_pin: $lora_miso_pin

# LoRa Radio Configuration (SX1276/SX1278)
sx127x:
  # data_rate: 100khz
  spi_id: spi3
  setup_priority: 801
  dio0_pin: $lora_dio0_pin
  cs_pin: $lora_cs_pin
  rst_pin: $lora_rst_pin
  pa_pin: BOOST
  pa_power: 10
  bandwidth: 125_0kHz
  crc_enable: true
  frequency: 915MHz
  # frequency: 433920000
  modulation: LORA
  rx_start: true
  sync_value: 0x12
  preamble_size: 8
  spreading_factor: 7
  coding_rate: CR_4_6
  on_packet:
    then:
      - lambda: |-
          id(receivedPackets)++;

globals:
  - { id: receivedPackets, type: int, initial_value: "0"}
  - { id: sentPackets, type: int, initial_value: "0"}

# Example button to send LoRa packet
button:
  - platform: restart
    name: "$device_name Restart"
  - platform: template
    name: "Send LoRa Packet"
    on_press:
      then:
        - lambda: id(sentPackets)++;
        - sx127x.send_packet:
            data: [0xDE, 0xAD, 0xBE, 0xEF, 0xCA, 0xFE, 0xBA, 0xBE]
  - platform: template
    name: "Send empty commandPacket"
    on_press:
      then:
        - lambda: id(sentPackets)++;
        - packet_transport.send_command:
            command: 0b1010_0101
            consumer: $device_name_receiver

packet_transport:
  platform: sx127x
  update_interval: never
  encryption: !secret LoRa_key
  rolling_code_enable: true
  ping_pong_enable: true
  ping_pong_recycle_time: 80s
  only_send_sensor_states_on_change: true
  retry_sending_sensor_states_enable: true
  retry_rate: 15s
  retry_timeout: 1min
  sensors:
    - id: garage_door_state_request
      broadcast_id: garage_door_state_request_2
  providers:
    - name: $device_name_opener
      encryption: !secret LoRa_key
  on_command:
    then:
      - lambda: |-
          char hex[256]; 
          ESP_LOGI("lora", "Received command: %lu :   %s", cmd,  format_hex_to(hex, data));

switch:
  - platform: template
    name: "remote Switch"
    optimistic: true
    id: local_switch
    turn_on_action:
      - sensor.template.publish: { id: garage_door_state_request, state: 12}
    turn_off_action:
      - sensor.template.publish: { id: garage_door_state_request, state: 8}


esp32_touch:
  id: esp32_touch_1
  setup_mode: true
  sleep_duration: 0.1ms
  measurement_duration: 0.25ms
  low_voltage_reference: 0.6V
  high_voltage_reference: 2.6V
  voltage_attenuation: 0V
  filter_mode: JITTER
  debounce_count: 3
  noise_threshold: 1
  jitter_step: 15
  smooth_mode: IIR_4

binary_sensor:
  - platform: packet_transport
    provider: $device_name_opener
    type: status
    name: opener connection status
    internal: false
  - platform: esp32_touch
    id: esp32_touch_pad
    name: "ESP32 Touch Pad"
    pin: GPIO8
    threshold: 100_000

sensor:
  - { platform: uptime, id: uptime_seconds, update_interval: 1min }
  - { platform: template, id: uptime_days, name: "$device_name uptime", update_interval: 1min, 
      device_class: duration, entity_category: "diagnostic", unit_of_measurement: "d", accuracy_decimals: 2,
      lambda: !lambda "return id(uptime_seconds).state / 86'400;"}
  - platform: packet_transport
    provider: $device_name_opener
    id: opener_garage_door_state
    name: remote state
    internal: false
    on_value:
      - { lambda: !lambda 'ESP_LOGI("lora", "remote got state: %.2f from opener", x);' }
  - platform: template
    id: garage_door_state_request
    name: local state
    internal: false
    update_interval: never
  - platform: template
    name: "Raw touch value"
    device_class: "voltage"
    lambda: |-
        return id(esp32_touch_pad).get_value();
    update_interval: 0.5s
    filters: 
      - sliding_window_moving_average:
          window_size: 30
          send_every: 15
  - platform: template
    name: "Touch diff"
    device_class: "voltage"
    lambda: |-
        return id(esp32_touch_pad).get_difference();
    update_interval: 0.5s
    filters: 
      - sliding_window_moving_average:
          window_size: 30
          send_every: 15