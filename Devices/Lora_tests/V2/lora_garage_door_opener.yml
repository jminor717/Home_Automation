    device_class: garage
    id: right_garage_door
    name: right garage door
    restore_mode: NO_RESTORE
    has_position: true
    open_action: { }
    close_action: { }
    tilt_action: { }
    tilt_lambda: !lambda "return 0.5;"
    lambda: "return 0.5;"