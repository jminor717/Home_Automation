# <<: !include ../../secrets.yaml

substitutions:
  device_name_opener: garage-door-opener
  device_name_receiver: t3-lora32


external_components:
  - source:
      type: local
      path: ../../../my_components # path relative to Devices folder

esphome:
  name: $device_name_opener
  on_boot:
    - priority: -100
      then:
        - sensor.template.publish:
            id: garage_door_state_request
            state: -1
        - sensor.template.publish:
            id: local_garage_door_state
            state: 0
esp32:
  variant: esp32
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf

preferences:
  # the default of 1min is far too short--flash chip is rated for approx 100k writes.
  flash_write_interval: "48h"

api:
  # password: ""
ota:
  platform: esphome
  password: ""

logger:
  level: INFO
  # logs:
  #   wifi: warn
  #   sensor: INFO
  #   adc.esp32: INFO
  #   adc.common: INFO
  #   mdns: INFO
  #   i2c: INFO
  #   i2c.idf: INFO
  #   switch: INFO
  #   switch.gpio: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "$device_name_opener AP"
    password: "BiSG9yrKP394"
captive_portal:

time:
  - platform: homeassistant

text_sensor:
  - platform: version
    name: "$device_name_opener Version"

# SPI bus for LoRa radio
spi:
  clk_pin: GPIO5
  mosi_pin: GPIO27
  miso_pin: GPIO19

# I2C for OLED display
i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz

# LoRa Radio Configuration (SX1276/SX1278)
sx127x:
  dio0_pin: GPIO26
  cs_pin: GPIO18
  rst_pin: GPIO23
  pa_pin: BOOST
  pa_power: 10
  bandwidth: 125_0kHz
  crc_enable: true
  frequency: 915MHz
  modulation: LORA
  rx_start: true
  sync_value: 0x12
  preamble_size: 8
  spreading_factor: 7
  coding_rate: CR_4_6
  on_packet:
    then:
      - lambda: |-
          id(receivedPackets)++;
          // char hex[256]; 
          // ESP_LOGI("lora", "Received packet RSSI: %.2f dBm, SNR: %.2f dB  %s", rssi, snr,  format_hex_to(hex, x));

globals:
  - { id: receivedPackets, type: int, initial_value: "0"}
  - { id: sentPackets, type: int, initial_value: "0"}

# Example button to send LoRa packet
button:
  - platform: restart
    name: "$device_name_opener Restart"
  - platform: template
    name: "Send LoRa Packet"
    on_press:
      then:
        - lambda: id(sentPackets)++;
        - sx127x.send_packet:
            data: [0xDE, 0xAD, 0xBE, 0xEF, 0xCA, 0xFE, 0xBA, 0xBE]


# OLED Display
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      it.printf(0, 0, id(display_font), "sender:%.0f", id(uptime_seconds).state);
      it.printf(0, 16, id(display_font), "TX: %d, RX: %d", id(sentPackets), id(receivedPackets));
      it.printf(0, 32, id(display_font), "L: %.0f, R: %.0f", id(local_garage_door_state).state, id(garage_door_state_request).state);


font:
  - file: "gfonts://Roboto"
    id: display_font
    size: 14

# status_led:
#   pin:
#     number: GPIO25
#     inverted: true



# Example configuration entry
packet_transport:
  platform: sx127x
  update_interval: never
  encryption: "780905cb-619f-4663-b246-256ba69c2ea6"
  rolling_code_enable: true
  ping_pong_enable: true
  # binary_sensors:
  #   - relay1_sensor
  sensors:
    - id: local_garage_door_state
      broadcast_id: opener_garage_door_state
  providers:
    - name: $device_name_receiver
      encryption: "780905cb-619f-4663-b246-256ba69c2ea6"


switch:
  - platform: gpio
    pin: GPIO25
    id: relay1
    name: "opener light"
  - platform: template
    name: "opener stitch"
    optimistic: true
    id: local_switch
    turn_on_action:
      - sensor.template.publish: { id: local_garage_door_state, state: 12}
    turn_off_action:
      - sensor.template.publish: { id: local_garage_door_state, state: 8}


binary_sensor:
  - platform: template
    id: relay1_sensor
    lambda: "return id(relay1).state;"
    internal: false
  - platform: packet_transport
    provider: $device_name_receiver
    type: status
    name: receiver connection status
    internal: false

sensor:
  - { platform: uptime, id: uptime_seconds, update_interval: 1min }
  - { platform: template, id: uptime_days, name: "$device_name_opener uptime", update_interval: 1min, 
      device_class: duration, entity_category: "diagnostic", unit_of_measurement: "d", accuracy_decimals: 2,
      lambda: !lambda "return id(uptime_seconds).state / 86'400;"}
  - platform: adc
    pin: GPIO35
    name: "Battery Voltage"
    attenuation: 12db
    filters:
      - multiply: 2.0  # Voltage divider correction
    update_interval: 60s
  - platform: packet_transport
    provider: $device_name_receiver
    id: garage_door_state_request
    name: remote state
    internal: false
    on_value:
      - { lambda: !lambda 'ESP_LOGI("lora", "opener got request: %.2f from remote", x);' }
      - if:
          condition: { lambda: !lambda 'return x > 10;' }
          then:
            # - logger.log: "The sensor value is above 10!"
            - switch.turn_on: relay1
            - delay: 5s
          else:
            - switch.turn_off: relay1
  - platform: template
    id: local_garage_door_state
    name: local state
    internal: false
    update_interval: never



