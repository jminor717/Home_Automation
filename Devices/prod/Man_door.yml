substitutions:
  device_name: central-return-damper
  eth_cs: GPIO9
  eth_clk: GPIO10
  eth_miso: GPIO11
  eth_mosi: GPIO12
  eth_int: GPIO13
  eth_rst: GPIO14
  man_door_lock_pin: GPIO19


external_components:
  - source:
      type: local
      path: ../../my_components # path relative to Devices folder
    components: [esp32_touch]

esphome:
  name: $device_name
  platformio_options:
    board_build.flash_mode: dio


esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y

preferences:
  # the default of 1min is far too short--flash chip is rated for approx 100k writes.
  flash_write_interval: "240h"

api:
  # password: ""
ota:
  platform: esphome
  password: ""

logger:
  level: info

ethernet:
  type: W5500
  clk_pin: $eth_clk
  mosi_pin: $eth_mosi
  miso_pin: $eth_miso
  cs_pin: $eth_cs
  interrupt_pin: $eth_int
  reset_pin: $eth_rst

time:
  - platform: homeassistant

button:
  - platform: restart
    name: "$device_name Restart"
  - platform: template
    name: "reset touch channel benchmark"
    on_press:
      then:
        - lambda: id(esp32_touch_pad).reset_benchmark();

output:
  - platform: ledc
    pin: $man_door_lock_pin
    id: man_door_lock_output
    frequency: 19531Hz


lock:
  - platform: template
    id: man_door_lock
    name: "Garage Man Door Lock"
    optimistic: true
    lock_action:
      - output.turn_off: man_door_lock_output
    unlock_action:
      - output.set_level: { id: man_door_lock_output, level: 80% }
      - script.execute: auto_lock_man_door
    open_action:
      - output.set_level: { id: man_door_lock_output, level: 80% }
      - script.execute: auto_lock_man_door


script: 
  - id: auto_lock_man_door
    mode: restart
    then:
      - delay: 5s
      - lock.lock: man_door_lock


esp32_touch:
  id: esp32_touch_1
  setup_mode: true
  sleep_duration: 0.1ms
  measurement_duration: 0.25ms
  low_voltage_reference: 0.6V
  high_voltage_reference: 2.6V
  voltage_attenuation: 0V
  filter_mode: JITTER
  debounce_count: 3
  noise_threshold: 1
  jitter_step: 15
  smooth_mode: IIR_4

binary_sensor:
  - platform: esp32_touch
    id: esp32_touch_pad
    name: "ESP32 Touch Pad"
    pin: GPIO8
    threshold: 100_000

sensor:
  - platform: template
    name: "Raw touch value"
    device_class: "voltage"
    lambda: |-
        return id(esp32_touch_pad).get_value();
    update_interval: 0.5s
    filters: 
      - sliding_window_moving_average:
          window_size: 25
          send_every: 30
          send_first_at: 30
  - platform: template
    name: "Touch diff"
    device_class: "voltage"
    lambda: |-
        return id(esp32_touch_pad).get_difference();
    update_interval: 0.5s
    filters: 
      - sliding_window_moving_average:
          window_size: 25
          send_every: 30
          send_first_at: 30


















