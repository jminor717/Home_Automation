.defaultfilters:
  - &moving_avg  [ throttle: 0.25s, sliding_window_moving_average: { window_size: 20, send_every: 10 } ]
  - &slow  [ delta: 0.9, throttle: 5s ]


sensor:
  - { platform: uptime, id: uptime_seconds, update_interval: 1min }
  - { platform: template, id: uptime_days, name: "$device_name uptime", update_interval: 1min, 
      device_class: duration, entity_category: "diagnostic", unit_of_measurement: "d", accuracy_decimals: 2,
      lambda: !lambda "return id(uptime_seconds).state / 86'400;"}
  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count: { name: Presence Target Count, filters: *slow }
    still_target_count: { name: Still Target Count, filters: *slow }
    moving_target_count: { name: Moving Target Count, filters: *slow }
    target_1:
      x: { name: Target-1 X, filters: *moving_avg }
      y: { name: Target-1 Y, filters: *moving_avg  }
      speed: { name: Target-1 Speed, filters: *moving_avg  }
      angle: { name: Target-1 Angle, filters: *moving_avg  }
      distance: { name: Target-1 Distance, filters: *moving_avg  }
      resolution: { name: Target-1 Resolution, filters: [ throttle: 5s ] }
    target_2:
      x: { name: Target-2 X, filters: *moving_avg  }
      y: { name: Target-2 Y, filters: *moving_avg  }
      speed: { name: Target-2 Speed, filters: *moving_avg  }
      angle: { name: Target-2 Angle, filters: *moving_avg  }
      distance: { name: Target-2 Distance, filters: *moving_avg  }
      resolution: { name: Target-2 Resolution, filters: [ throttle: 5s ] }
    zone_1:
      target_count: { name: Zone-1 All Target Count, filters: *slow }
      still_target_count: { name: Zone-1 Still Target Count, filters: *slow }
      moving_target_count: { name: Zone-1 Moving Target Count, filters: *slow }
        



