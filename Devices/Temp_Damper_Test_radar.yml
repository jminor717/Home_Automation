substitutions:
  device_name: erv-return-box
  eth_cs: GPIO9
  eth_clk: GPIO10
  eth_miso: GPIO11
  eth_mosi: GPIO12
  eth_int: GPIO13
  eth_rst: GPIO14

external_components:
  - source:
      type: local
      path: ../my_components # path relative to Devices folder



#include ""
#include ""
esphome:
  name: $device_name
  # includes:
    # - <erv_ctrl\pressurePeakFilter.h>
    # - <freertos/FreeRTOS.h>
    # - <freertos/task.h>
  # on_boot:
  #   - priority: -100
  #     then:
  #       - lock.lock: man_door_lock
  # platformio_options:
  #   board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    # sdkconfig_options:
    #   CONFIG_FREERTOS_USE_TRACE_FACILITY: y
    #   CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: y
    #   CONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS: y
      # CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y


#define configUSE_TRACE_FACILITY        1
#define configUSE_STATS_FORMATTING_FUNCTIONS 1


preferences:
  # the default of 1min is far too short--flash chip is rated for approx 100k writes.
  flash_write_interval: "240h"

api:
  # password: ""
ota:
  platform: esphome
  password: ""

logger:
  # level: very_verbose
  level: INFO
  # logs:
  #   sensor: WARN
  #   button: INFO
  #   wifi: INFO
  #   adc: INFO
  #   adc.common: INFO
  #   adc.esp32: INFO
  #   ntc: INFO
  #   mdns: INFO
  #   climate: INFO
  #   resistance: INFO
  #   ledc.output: INFO
  #   homeassistant.text_sensor: INFO
  #   pid.sensor: INFO



ethernet:
  type: W5500
  clk_pin: $eth_clk
  mosi_pin: $eth_mosi
  miso_pin: $eth_miso
  cs_pin: $eth_cs
  interrupt_pin: $eth_int
  reset_pin: $eth_rst

time:
  - platform: homeassistant


button:
  - platform: restart
    name: "$device_name Restart"
  # - platform: ld2450
  #   ld2450_id: ld2450_radar
  #   factory_reset:
  #     name: "LD2450 Factory Reset"
  #     entity_category: "config"
  #   restart:
  #     name: "LD2450 Restart"
  #     entity_category: "config"


text_sensor:
  - platform: version
    name: "$device_name Version"
  - platform: ld2450
    ld2450_id: ld2450_radar
    version:
      name: "LD2450 Firmware"
    mac_address:
      name: "LD2450 BT MAC"
    target_1:
      direction:
        name: "Target-1 Direction"
    target_2:
      direction:
        name: "Target-2 Direction"
    target_3:
      direction:
        name: "Target-3 Direction"


uart:
  id: uart_ld2450
  tx_pin: GPIO19
  rx_pin: 
    number: GPIO20
    mode:
      input: true
      pullup: true
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2450:
  id: ld2450_radar
  uart_id: uart_ld2450

